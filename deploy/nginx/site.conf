# ==========================================================================
# nginx для сайта ресторана (production)
# --------------------------------------------------------------------------
# Используется двумя способами:
#   1. Внутри Docker-образа  (см. Dockerfile)
#   2. На «голом» VPS: положите файл в /etc/nginx/conf.d/restaurant.conf
#      и поправьте server_name + пути, либо используйте deploy/vps-install.sh
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # <-- ваш домен

    # корень сайта: папка проекта (для Docker — /usr/share/nginx/html)
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # --- сжатие: текст и json летят в 3-4 раза меньше ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml image/svg+xml;

    # --- безопасность: базовые заголовки ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- кэширование ---
    # HTML и JSON не кэшируем: правки контента видны сразу после публикации
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /data/site.json { add_header Cache-Control "no-cache, must-revalidate"; }

    # Картинки/стили/скрипты с хэшем имени кэшируем надолго.
    # ВАЖНО: если меняете файл, не меняя имя — браузер может держать старую
    # версию до суток. Для картинок это обычно нормально.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # --- SPA-фолбэк не нужен: сайт одностраничный, но 404 отдаём красиво ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}

